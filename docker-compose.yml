name: fluxopro-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxopro-postgres-dev
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
      POSTGRES_DB: fluxo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluxo -d fluxo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fluxopro-redis-dev
    profiles: [redis]
    ports:
      - '6379:6379'

  mailpit:
    image: axllent/mailpit
    container_name: fluxopro-mailpit-dev
    ports:
      - '8025:8025'
      - '1025:1025'

  minio:
    image: minio/minio
    container_name: fluxopro-minio-dev
    profiles: [storage]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    container_name: fluxopro-api-dev
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://fluxo:fluxo@postgres:5432/fluxo?schema=public
      CORS_ORIGIN: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - '4000:4000'
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/apps/api/node_modules
      - shared_node_modules:/workspace/packages/shared/node_modules
      - root_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm --filter @fluxo/shared build && pnpm prisma generate && pnpm prisma migrate deploy && pnpm --filter @fluxo/api dev"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    container_name: fluxopro-web-dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
      - shared_node_modules:/workspace/packages/shared/node_modules
      - root_node_modules:/workspace/node_modules
    depends_on:
      - api

  prisma-studio:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    container_name: fluxopro-prisma-studio-dev
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://fluxo:fluxo@postgres:5432/fluxo?schema=public
    command: pnpm prisma studio --port 5555 --browser none
    ports:
      - '5555:5555'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  root_node_modules:
