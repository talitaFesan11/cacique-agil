name: fluxopro

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: fluxopro-proxy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - frontend
      - backend
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: prod
    container_name: fluxopro-web
    env_file: .env.production.example
    expose:
      - '3000'
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 15s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    container_name: fluxopro-api
    env_file: .env.production.example
    expose:
      - '4000'
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrate
    container_name: fluxopro-migrate
    env_file: .env.production.example
    networks:
      - backend
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fluxopro-postgres
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: CHANGE_ME_PASSWORD
      POSTGRES_DB: fluxo
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluxo -d fluxo']
      interval: 10s

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata_prod:
